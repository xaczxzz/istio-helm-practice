apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: unified-vs
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - app-gateway
  http:
  # ============================================
  # Monitoring Routes (Direct to Services)
  # All monitoring tools are accessed directly via Istio Ingress Gateway
  # ============================================
  
  # Kiali routes - handle both with and without trailing slash
  - match:
    - uri:
        prefix: /monitoring/kiali/
    rewrite:
      uri: /kiali/
    route:
    - destination:
        host: kiali.istio-system.svc.cluster.local
        port:
          number: 20001
    headers:
      request:
        set:
          X-Forwarded-Prefix: /monitoring/kiali

  - match:
    - uri:
        exact: /monitoring/kiali
    redirect:
      uri: /monitoring/kiali/
      redirectCode: 301

  # Kiali static resources (CSS, JS, API calls from /kiali/ path)
  - match:
    - uri:
        prefix: /kiali/
    route:
    - destination:
        host: kiali.istio-system.svc.cluster.local
        port:
          number: 20001

  # Jaeger routes
  - match:
    - uri:
        prefix: /monitoring/jaeger
    route:
    - destination:
        host: monitoring-jaeger-query.istio-system.svc.cluster.local
        port:
          number: 16686

  # Grafana routes - handle both with and without trailing slash
  - match:
    - uri:
        prefix: /monitoring/grafana/
    rewrite:
      uri: /
    route:
    - destination:
        host: monitoring-stack-grafana.monitoring.svc.cluster.local
        port:
          number: 80
    headers:
      request:
        set:
          X-Forwarded-Prefix: /monitoring/grafana
          X-Forwarded-Host: "*"

  - match:
    - uri:
        exact: /monitoring/grafana
    redirect:
      uri: /monitoring/grafana/
      redirectCode: 301

  # Prometheus routes - handle both with and without trailing slash
  - match:
    - uri:
        prefix: /monitoring/prometheus/
    rewrite:
      uri: /
    route:
    - destination:
        host: monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local
        port:
          number: 9090
    headers:
      request:
        set:
          X-Forwarded-Prefix: /monitoring/prometheus

  - match:
    - uri:
        exact: /monitoring/prometheus
    redirect:
      uri: /monitoring/prometheus/
      redirectCode: 301
  
  # ============================================
  # Backend Service Routes (Direct - No API Gateway)
  # Frontend connects directly to backend services
  # IMPORTANT: These MUST come BEFORE Grafana's catch-all routes
  # ============================================
  
  # Order Service - Health Check (exact match first!)
  - match:
    - uri:
        exact: /api/orders/health
    rewrite:
      uri: /health
    route:
    - destination:
        host: app-stack-order-service.default.svc.cluster.local
        port:
          number: 8080
  
  # Order Service - API routes
  - match:
    - uri:
        prefix: /api/orders
    rewrite:
      uri: /orders
    route:
    - destination:
        host: app-stack-order-service.default.svc.cluster.local
        port:
          number: 8080
  
  # User Service - Health Check (exact match first!)
  - match:
    - uri:
        exact: /api/users/health
    rewrite:
      uri: /health
    route:
    - destination:
        host: app-stack-user-service.default.svc.cluster.local
        port:
          number: 8000
  
  # User Service - API routes
  - match:
    - uri:
        prefix: /api/users
    rewrite:
      uri: /users
    route:
    - destination:
        host: app-stack-user-service.default.svc.cluster.local
        port:
          number: 8000
  
  # Inventory Service - Health Check (exact match first!)
  - match:
    - uri:
        exact: /api/inventory/health
    rewrite:
      uri: /health
    route:
    - destination:
        host: app-stack-inventory-service.default.svc.cluster.local
        port:
          number: 3000
  
  # Inventory Service - API routes
  - match:
    - uri:
        prefix: /api/inventory
    rewrite:
      uri: /inventory
    route:
    - destination:
        host: app-stack-inventory-service.default.svc.cluster.local
        port:
          number: 3000
  
  # ============================================
  # Grafana Static Resources (AFTER backend API routes)
  # Grafana needs /login, /api, /public, etc. but NOT /api/orders, /api/users, /api/inventory
  # ============================================
  
  # Grafana static resources and API calls (login, api, public, etc.)
  # This catches Grafana's own /api/* calls (like /api/dashboards)
  # Backend service routes above will catch /api/orders, /api/users, /api/inventory first
  - match:
    - uri:
        regex: "^/(login|api|public|avatar|plugins).*"
    route:
    - destination:
        host: monitoring-stack-grafana.monitoring.svc.cluster.local
        port:
          number: 80
  
  # ============================================
  # Frontend Routes (Default/Catch-all)
  # All other requests go to frontend
  # 이것은 반드시 마지막에 위치해야 함
  # ============================================
  
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: app-stack-frontend
        port:
          number: 80