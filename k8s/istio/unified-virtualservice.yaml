apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: unified-vs
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - app-gateway
  http:
  # ============================================
  # Monitoring Routes (Direct to Services)
  # All monitoring tools are accessed directly via Istio Ingress Gateway
  # ============================================
  
  - match:
    - uri:
        prefix: /monitoring/kiali
    rewrite:
      uri: /kiali
    route:
    - destination:
        host: kiali.istio-system.svc.cluster.local
        port:
          number: 20001

  - match:
    - uri:
        prefix: /monitoring/jaeger
    route:
    - destination:
        host: monitoring-jaeger-query.istio-system.svc.cluster.local
        port:
          number: 16686

  - match:
    - uri:
        prefix: /monitoring/grafana
    route:
    - destination:
        host: monitoring-stack-grafana.monitoring.svc.cluster.local
        port:
          number: 80

  - match:
    - uri:
        prefix: /monitoring/prometheus
    route:
    - destination:
        host: monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local
        port:
          number: 9090
  
  # ============================================
  # Backend Service Routes (Direct - No API Gateway)
  # Frontend connects directly to backend services
  # ============================================
  
  # Order Service
  - match:
    - uri:
        prefix: /api/orders
    rewrite:
      uri: /orders
    route:
    - destination:
        host: app-stack-order-service
        port:
          number: 8080
  
  # User Service
  - match:
    - uri:
        prefix: /api/users
    rewrite:
      uri: /users
    route:
    - destination:
        host: app-stack-user-service
        port:
          number: 8000
  
  # Inventory Service
  - match:
    - uri:
        prefix: /api/inventory
    rewrite:
      uri: /inventory
    route:
    - destination:
        host: app-stack-inventory-service
        port:
          number: 3000
  
  # ============================================
  # Frontend Routes (Default/Catch-all)
  # All other requests go to frontend
  # ============================================
  
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: app-stack-frontend
        port:
          number: 80